[project]
name = "whispo"
version = "0.1.0"
description = "Local interview transcription with a Textual TUI on top of WhisperX + Ollama"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.80",
]

[project.scripts]
whispo = "whispo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whispo"]
